<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life is Feudal</title>
    <link rel="stylesheet" href="LW1CSS.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <!-- Created by me - Basic HTML setup and font imports -->
</head>
<body>
    <div class="background-overlay"></div>
    <!-- Created by me - Simple overlay for better visibility -->
    
    <div class="video-container">
        <video id="backgroundVideo">
            <source src="backgroundvideo.mp4" type="video/mp4">
        </video>
    </div>

    <div class="flash-layer">
        <img src="flashphoto.jpg" alt="Flash Fotoğrafı">
    </div>
    <!-- Created by me - Flash effect layer -->

    <div class="loading-screen">
        <div class="loading-circle"></div>
        <div class="loading-text">Feodal Dünyaya Giriş...</div>
    </div>
    <!-- AI Prompt: "Design a medieval-style loading screen with circle animation and themed text" -->

    <div class="title-text">
        <h1>Savaşçının Yolculuğu Başlıyor...</h1>
    </div>
    
    <div class="instructions">
        <p>Kılıca tıklayarak başla</p>
    </div>

    <div class="sword-container">
        <div class="css-sword" id="sword">
            <div class="sword-handle">
                <div class="handle-top"></div>
                <div class="handle-grip"></div>
                <div class="handle-bottom"></div>
            </div>
            <div class="sword-guard"></div>
            <div class="sword-blade">
                <div class="blade-edge"></div>
                <div class="blade-shine"></div>
                <div class="blade-runes"></div>
            </div>
            <div class="sword-glow"></div>
        </div>
    </div>
    <!-- AI Prompt: "Create HTML structure for an interactive CSS-only medieval sword with handle, guard, blade, and special effects" -->

    <div class="particles-container"></div>
    <!-- Created by me - Container for particle effects -->

    <div class="login-container">
        <h2>Savaşçı Girişi</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Savaşçının Adı</label>
                <input type="text" id="username" name="username" required>
                <div class="input-focus-effect"></div>
            </div>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" required>
                <div class="input-focus-effect"></div>
                <div class="password-toggle">
                    <i class="eye-icon"></i>
                </div>
            </div>
            <button type="submit">Macerana Başla</button>
            <div class="form-options">
                <a href="#" class="forgot-password">Şifreni mi unuttun?</a>
                <a href="#" class="register">Yeni Savaşçı</a>
            </div>
        </form>
    </div>
    <!-- AI Prompt: "Design a medieval-themed login form with username, password fields, eye toggle for password visibility, and themed buttons" -->

    <div class="sound-control">
        <div class="sound-icon"></div>
    </div>
    <!-- Created by me - Simple sound control button -->

    <script>
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.querySelector('.loading-screen').classList.add('hidden');
                document.querySelector('.title-text').classList.add('show');
                
                setTimeout(() => {
                    document.querySelector('.instructions').classList.add('show');
                    document.querySelector('.sword-container').classList.add('show');
                }, 1000);
            }, 2000);
        });
        // Created by me - Basic loading sequence and animations

        const soundControl = document.querySelector('.sound-control');
        let soundEnabled = true;
        
        soundControl.addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            this.classList.toggle('muted');
            document.getElementById('backgroundVideo').muted = !soundEnabled;
        });
        // Created by me - Sound toggle functionality

        const passwordToggle = document.querySelector('.password-toggle');
        const passwordInput = document.getElementById('password');
        
        passwordToggle.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.classList.add('visible');
            } else {
                passwordInput.type = 'password';
                this.classList.remove('visible');
            }
        });
        // AI Prompt: "Write JavaScript for password visibility toggle with eye icon" */

        function createParticles() {
            const particlesContainer = document.querySelector('.particles-container');
            
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.setProperty('--delay', `${Math.random() * 2}s`);
                particle.style.setProperty('--size', `${Math.random() * 5 + 2}px`);
                particlesContainer.appendChild(particle);
            }
        }
        
        createParticles();
        // AI Prompt: "Create a function to generate random gold particles with varying sizes and delays" */

        let loginAttempts = [];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            loginAttempts.push({
                username: username,
                password: password,
                timestamp: new Date().toISOString()
            });
            
            console.log('All Login Attempts:', loginAttempts);
            
            console.log(' Last Login Information:', {
                username: username,
                password: password,
                time: new Date().toLocaleTimeString()
            });
            
            alert('Savaşçı, macera seni bekliyor.');
            
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';

            if (username === 'admin' && password === 'admin') {
                alert('Giriş başarılı! Yönlendiriliyorsunuz...');
                window.location.href = 'table.html';
            } else {
                alert('Hatalı giriş! Lütfen tekrar deneyin.');
            }
            //Created by me - I redirected to the table.html page if the username and password are correct.
        });
        // Created by me - Basic login form handling and logging

        const sword = document.getElementById('sword');
        const swordContainer = document.querySelector('.sword-container');
        const video = document.getElementById('backgroundVideo');
        const flashLayer = document.querySelector('.flash-layer');
        const loginContainer = document.querySelector('.login-container');
        const titleText = document.querySelector('.title-text');
        const instructions = document.querySelector('.instructions');
        let isUp = false;
        let isAnimating = false;

        sword.addEventListener('mouseover', function() {
            if (!isAnimating) {
                document.querySelector('.sword-glow').classList.add('active');
            }
        });
        
        sword.addEventListener('mouseout', function() {
            if (!isAnimating) {
                document.querySelector('.sword-glow').classList.remove('active');
            }
        });
        // Created by me - Sword hover glow effect handling

        sword.addEventListener('click', function() {
            if (isAnimating) return;
            
            isAnimating = true;
            
            if (!isUp) {
                sword.classList.remove('up', 'spin-down');
                sword.classList.add('spin-up');
                
                titleText.classList.remove('show');
                instructions.classList.remove('show');
                
                document.querySelector('.particles-container').classList.add('active');
                
                setTimeout(() => {
                    sword.classList.remove('spin-up');
                    sword.classList.add('up');
                    
                    setTimeout(() => {
                        swordContainer.classList.add('hidden');
                        document.querySelector('.particles-container').classList.remove('active');
                        
                        video.currentTime = 0;
                        video.play();
                        
                        video.onended = function() {
                            flashLayer.classList.add('show');
                            
                            setTimeout(() => {
                                loginContainer.classList.add('show');
                                
                                setTimeout(() => {
                                    swordContainer.classList.remove('hidden');
                                    swordContainer.classList.add('enter');
                                    
                                    setTimeout(() => {
                                        swordContainer.classList.remove('enter');
                                    }, 1200);
                                }, 500);
                            }, 1000);
                        };
                    }, 500);
                    
                    isUp = true;
                    isAnimating = false;
                }, 1000);
                
            } else {
                sword.classList.remove('up', 'spin-up');
                sword.classList.add('spin-down');
                
                setTimeout(() => {
                    sword.classList.remove('spin-down');
                    video.pause();
                    video.currentTime = 0;
                    flashLayer.classList.remove('show');
                    loginContainer.classList.remove('show');
                    
                    setTimeout(() => {
                        titleText.classList.add('show');
                        
                        setTimeout(() => {
                            instructions.classList.add('show');
                        }, 500);
                    }, 500);
                    
                    isUp = false;
                    isAnimating = false;
                }, 1000);
            }
        });
        // AI Prompt: "Write complex JavaScript for sword click animation sequence that plays video, shows login form, and handles state transitions with proper timing" */
    
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loginContainer = document.querySelector('.login-container');
    
            let formToggleNotification = document.createElement('div');
            formToggleNotification.className = 'form-toggle-notification';
            formToggleNotification.textContent = 'H\'ye basarak Formu açın.';
            loginContainer.appendChild(formToggleNotification);
            
            const clockContainer = document.createElement('div');
            clockContainer.className = 'clock-container';
            
            const clock = document.createElement('div');
            clock.id = 'clock';
            clockContainer.appendChild(clock);
            
            document.body.appendChild(clockContainer);
            
            updateClock();
            setInterval(updateClock, 1000);
        });
        // AI Prompt: "Create a clock element that shows the current time and updates every second" */

        let formsVisible = true;

        document.addEventListener('keydown', function(e) {
            if (e.key.toLowerCase() === 'h') {
                const forms = document.querySelectorAll('form');
                const loginContainer = document.querySelector('.login-container');
                const formToggleNotification = document.querySelector('.form-toggle-notification');
                
                if (formsVisible) {
                    forms.forEach(form => {
                        form.classList.add('form-fade-out');
                    });
                    
                    setTimeout(() => {
                        forms.forEach(form => {
                            form.style.display = 'none';
                            form.classList.remove('form-fade-out');
                        });
                        
                        formToggleNotification.classList.add('show');
                    }, 500);
                    
                } else {
                    formToggleNotification.classList.remove('show');
                    
                    forms.forEach(form => {
                        form.style.display = 'block';
                        form.classList.add('form-fade-in');
                    });
                    
                    setTimeout(() => {
                        forms.forEach(form => {
                            form.classList.remove('form-fade-in');
                        });
                    }, 500);
                }
                
                formsVisible = !formsVisible;
            }
        });
        // AI Prompt: "Create a form toggle notification that shows/hides all forms when the 'h' key is pressed" */
    </script>
</body>
</html>
